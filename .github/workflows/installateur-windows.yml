name: Installateur Windows

# Installateur NSIS du poste central (apps/desktop, fiche 0023 : caisses POS sous Windows).
# Long (environ 20 min) : sur main, sur les étiquettes v*, à la demande, et sur les pull requests qui touchent la coquille.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/installateur-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installateur:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui

      # Clé publique des licences : secret YOUMA_CLE_PUBLIQUE. Sans lui, clé de DÉVELOPPEMENT (interdit pour une version v*).
      - name: Clé des licences
        shell: bash
        env:
          CLE: ${{ secrets.YOUMA_CLE_PUBLIQUE }}
        run: |
          if [ -n "$CLE" ]; then
            echo "YOUMA_CLE_PUBLIQUE=$CLE" >> "$GITHUB_ENV"
            echo "SUFFIXE=" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::Secret YOUMA_CLE_PUBLIQUE absent : une version publiée ne peut pas utiliser la clé de développement."
            exit 1
          else
            echo "::warning::Secret YOUMA_CLE_PUBLIQUE absent : installateur construit avec la clé de DÉVELOPPEMENT (essais seulement)."
            echo "SUFFIXE=-dev" >> "$GITHUB_ENV"
          fi

      - name: Outil Tauri
        run: cargo install tauri-cli --version "^2" --locked
      - name: Construire l'installateur
        working-directory: apps/desktop/src-tauri
        run: cargo tauri build

      - name: Renommer
        shell: bash
        run: |
          mkdir -p sortie
          for f in apps/desktop/src-tauri/target/release/bundle/nsis/*.exe; do
            cp "$f" "sortie/$(basename "${f%.exe}")${SUFFIXE}.exe"
          done
          ls -l sortie
      - uses: actions/upload-artifact@v4
        with:
          name: installateur-windows${{ env.SUFFIXE }}
          path: sortie/*.exe
          retention-days: 30

      # Étiquette v* : l'installateur est joint à la version GitHub.
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: sortie/*.exe
